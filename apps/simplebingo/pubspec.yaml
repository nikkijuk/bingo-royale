name: simplebingo
description: simple bingo app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  play_bingo:
    path: ../../packages/features/play_bingo

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true

  # Handles localization tasks.
  # This field can appear as a subfield of flutter and material.
  #
  # Target gen_localizations failed:
  #   Error:
  #     Attempted to generate localizations code without having the flutter: generate flag turned on.
  # Check pubspec.yaml and ensure that flutter:
  #   generate: true has been added and rebuild the project. Otherwise, the localizations source code will not be importable.
  generate: true
